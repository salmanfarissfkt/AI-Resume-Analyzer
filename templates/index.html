
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container">

        <h1>AI Resume Analyzer</h1>

        <p class="subtitle">
            Analyze your resume, identify skill gaps, and discover
            how well your profile matches a job.
        </p>

        <form action="/upload"
              method="POST"
              enctype="multipart/form-data">

            <label for="resume">Upload your resume (PDF)</label>
            <input type="file"
                   id="resume"
                   name="resume"
                   accept=".pdf,application/pdf"
                   required>

            <label for="job_description">Job Description</label>
            <textarea id="job_description"
                      name="job_description"
                      rows="10"
                      placeholder="Paste the complete job description here..."
                      required></textarea>

            <button type="submit">Analyze My Resume</button>
        </form>

        <p>
            <a href="{{ url_for('about') }}">About this project</a>
        </p>

        <p class="footer">
            Powered by SFKT Technologies
        </p>

    </div>
</body>
</html>
